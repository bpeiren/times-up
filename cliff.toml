# git-cliff configuration: https://git-cliff.org/docs/configuration
#
# Generates CHANGELOG.md from the conventional commit messages (see AGENTS.md). The file is committed
# only at releases and has no "Unreleased" section:
#   git cliff --unreleased                                preview what is coming (not written)
#   git cliff --tag v0.0.2 -o CHANGELOG.md                the file for release 0.0.2
#   git cliff --unreleased --tag v0.0.2 --strip all       notes for the GitHub release of 0.0.2
#   git cliff --latest --strip all                        notes of the newest tagged release

[changelog]
header = """
# Changelog

All notable changes to Time's up. This file is generated from the conventional commit messages with
[git-cliff](https://git-cliff.org); do not edit it by hand (see `AGENTS.md`).

"""
# One section per release tag, newest first; commits grouped by type. The <!-- n --> comments only
# fix the order of the groups and are stripped from the output.
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}**BREAKING:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/bpeiren/times-up/commit/{{ commit.id }}))    {%- endfor %}
{% endfor %}

"""
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/bpeiren/times-up/compare/{{ release.previous.version }}...{{ release.version }}
        {% else -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/bpeiren/times-up/releases/tag/{{ release.version }}
        {% endif -%}
    {% else -%}
        [Unreleased]: https://github.com/bpeiren/times-up/compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
# The first matching parser wins. Bookkeeping commits are left out of the changelog.
commit_parsers = [
  { message = "^chore", skip = true },
  { message = "^(docs|build)\\((groma|backlog|release)\\)", skip = true },
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^build", group = "<!-- 4 -->Build and packaging" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
]
